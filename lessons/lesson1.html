<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽列 Navigation -->

        <div class="flex items-center space-x-4">

            </span>
            <span class="text-slate-600">|</span>

            </button>
        </div>
    </header>

    <!-- 主要區域 Main Content -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- 左側：教學內容與單元導覽 -->
        <aside class="w-full lg:w-96 bg-slate-800/80 p-5 border-r border-slate-700 flex flex-col overflow-y-auto">
            
            <!-- 單元切換頁籤 -->
            <div class="mb-4">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">選擇學習單元</label>
                <div class="grid grid-cols-2 gap-2" id="lesson-tabs">
                    <button onclick="switchLesson(0)" id="tab-0" class="tab-btn active p-2 text-xs font-medium rounded border transition text-left">1. 輸入與輸出</button>
                    <button onclick="switchLesson(1)" id="tab-1" class="tab-btn p-2 text-xs font-medium rounded border transition text-left">2. 變數與型別</button>
                    <button onclick="switchLesson(2)" id="tab-2" class="tab-btn p-2 text-xs font-medium rounded border transition text-left">3. 算術運算子</button>
                    <button onclick="switchLesson(3)" id="tab-3" class="tab-btn p-2 text-xs font-medium rounded border transition text-left">4. 綜合實戰題</button>
                </div>
            </div>

            <hr class="border-slate-700 my-2">

            <!-- 動態教學說明內容 -->
            <div id="tutorial-content" class="flex-1 space-y-4 text-slate-300 text-sm leading-relaxed overflow-y-auto pr-1">

            <!-- 底部分頁導覽按鈕 -->

                    <i class="fa-solid fa-arrow-left"></i> 上一課
                </button>
                <button id="next-btn" onclick="nextLesson()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs text-white font-semibold">
                    下一課 <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </aside>

        <!-- 右側：編輯器與終端機 -->
        <main class="flex-1 flex flex-col bg-slate-950">
            
            <!-- 程式碼編輯區 -->
            <div class="flex-1 p-4 border-b border-slate-800 flex flex-col min-h-[300px]">
                <div class="text-xs text-slate-400 mb-2 flex justify-between items-center">
                    <span class="font-mono flex items-center gap-2"><i class="fa-regular fa-file-code text-blue-400"></i> main.cpp</span>
                    <div id="solution-toggle-container" class="hidden">
                        <button onclick="toggleAnswer()" id="answer-btn" class="text-xs px-2.5 py-1 bg-amber-600/30 text-amber-300 border border-amber-500/50 rounded hover:bg-amber-600/50">

            <!-- 模擬終端機 Console Output -->

    <!-- 腳本邏輯處理 -->
    <script>
        // 四個教學單元的完整資料
        const lessons = [
            {

                    <h3 class="text-sm font-semibold text-blue-400 mt-3 mb-1">1.1 cout 串接與換行</h3>

            {

                content: `
                    <h2 class="text-lg font-bold text-white mb-2">3. 算術運算子</h2>
                    <p>C++ 支持基礎數學運算，但要注意**整數除法**的陷阱！</p>

                    <h3 class="text-sm font-semibold text-blue-400 mt-3 mb-1">3.1 運算子列表</h3>
                    <ul class="list-disc list-inside text-xs space-y-1 my-2">

            {

                content: `
                    <h2 class="text-lg font-bold text-white mb-2">🎯 綜合練習題：找零計算器</h2>
                    <p class="text-xs leading-relaxed">請編寫一個系統，輸入商品單價、數量與顧客支付金額，計算並印出：</p>
                    <ol class="list-decimal list-inside text-xs space-y-1 my-2">
                        <li>總金額與應找零金額。</li>
                        <li>使用 <code class="text-amber-300 font-mono">/</code> 與 <code class="text-amber-300 font-mono">%</code> 換算應找回幾張 <strong>100元鈔票</strong>、幾個 <strong>10元硬幣</strong> 與 <strong>1元硬幣</strong>。</li>

                    <div class="p-2 bg-slate-700/60 rounded text-xs text-amber-300 border border-slate-600 mt-3">
                        💡 點擊編輯器右上角按鈕可切換顯示「參考解答」。
                    </div>
                `,
                defaultCode: `#include <iostream>

    cout << "應找零：" << change << " 元" << endl;
    cout << "100元張數：" << hundred << " 張" << endl;

                solutionCode: `#include <iostream>
using namespace std;

int main() {
    int price, count, pay;

    cout << "請輸入商品單價：";
    cin >> price;
    cout << "請輸入購買數量：";
    cin >> count;

    cin >> pay;

    int total = price * count;
    int change = pay - total;

    int remainder = change % 100;
    int ten = remainder / 10;
    int one = remainder % 10;

    cout << "\n=== 結帳單 ===" << endl;
    cout << "總金額：" << total << " 元" << endl;
    cout << "應找零：" << change << " 元" << endl;
    cout << "100元張數：" << hundred << " 張" << endl;

    return 0;
}`,
                hasSolution: true
            }
        ];

        let currentLessonIndex = 0;
        let showingSolution = false;
        let inputQueue = [];

        // 初始化頁面
        window.onload = () => {
            switchLesson(0);
        };

        // 切換單元邏輯
        function switchLesson(index) {
            currentLessonIndex = index;
            showingSolution = false;
            
            // 更新 UI 狀態
            document.getElementById('current-lesson-title').innerText = lessons[index].title;
            document.getElementById('tutorial-content').innerHTML = lessons[index].content;
            document.getElementById('code-editor').value = lessons[index].defaultCode;

            // 切換按鈕 active 樣式
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if (idx === index) {
                    btn.className = "tab-btn active p-2 text-xs font-medium rounded border border-blue-500 bg-blue-600/30 text-blue-200 transition text-left";
                } else {
                    btn.className = "tab-btn p-2 text-xs font-medium rounded border border-slate-700 bg-slate-800 text-slate-400 hover:bg-slate-700 transition text-left";
                }
            });

            // 控制前後按鈕狀態
            document.getElementById('prev-btn').disabled = (index === 0);
            document.getElementById('next-btn').disabled = (index === lessons.length - 1);

            // 控制解答按鈕顯示
            const solutionContainer = document.getElementById('solution-toggle-container');
            if (lessons[index].hasSolution) {
                solutionContainer.classList.remove('hidden');
                document.getElementById('answer-btn').innerText = "💡 查看參考解答";
            } else {
                solutionContainer.classList.add('hidden');
            }

            clearConsole();
        }

        function prevLesson() {
            if (currentLessonIndex > 0) switchLesson(currentLessonIndex - 1);
        }

        function nextLesson() {
            if (currentLessonIndex < lessons.length - 1) switchLesson(currentLessonIndex + 1);
        }

        function resetCode() {
            document.getElementById('code-editor').value = lessons[currentLessonIndex].defaultCode;
            showingSolution = false;
            if (lessons[currentLessonIndex].hasSolution) {
                document.getElementById('answer-btn').innerText = "💡 查看參考解答";
            }
        }

        function toggleAnswer() {
            const lesson = lessons[currentLessonIndex];
            if (!lesson.hasSolution) return;

            if (showingSolution) {
                document.getElementById('code-editor').value = lesson.defaultCode;
                document.getElementById('answer-btn').innerText = "💡 查看參考解答";
                showingSolution = false;
            } else {
                document.getElementById('code-editor').value = lesson.solutionCode;
                document.getElementById('answer-btn').innerText = "🔄 切換回題目模板";
                showingSolution = true;
            }
        }

        function clearConsole() {
            document.getElementById('console-output').innerHTML = '<span class="text-slate-500">// 終端機已清空</span>';
            document.getElementById('cin-prompt-container').classList.add('hidden');
        }

        // 前端模擬 C++ 執行與 cin/cout 解析器 (簡易模擬)
        function runCode() {
            const code = document.getElementById('code-editor').value;
            const consoleBox = document.getElementById('console-output');
            consoleBox.innerHTML = ''; // 清空 console

            // 檢查代碼中包含多少 cin 請求
            const cinMatches = code.match(/cin\s*>>\s*([a-zA-Z0-9_]+)/g);
            inputQueue = [];

            if (cinMatches && cinMatches.length > 0) {
                // 需要輸入
                promptForInputs(cinMatches, code);
            } else {
                // 純輸出執行
                executeMockCode(code, []);
            }
        }

        function promptForInputs(cinMatches, code) {
            const promptContainer = document.getElementById('cin-prompt-container');
            promptContainer.classList.remove('hidden');
            document.getElementById('cin-input').focus();
            
            // 簡化版的互動：跳出輸入框接收數值
            window.currentCodeToExec = code;
            window.neededInputsCount = cinMatches.length;
            window.collectedInputs = [];
            
            const consoleBox = document.getElementById('console-output');
            consoleBox.innerHTML += `<div class="text-amber-400">[系統] 檢測到程式需要 ${cinMatches.length} 個輸入值，請在下方輸入框依序填入：</div>`;
        }

        function handleCinSubmit(e) {
            if (e.key === 'Enter') submitCinValue();
        }

        function submitCinValue() {
            const inputEl = document.getElementById('cin-input');
            const val = inputEl.value.trim();
            if (!val) return;

            window.collectedInputs.push(val);
            document.getElementById('console-output').innerHTML += `<div class="text-amber-300">輸入值: ${val}</div>`;
            inputEl.value = '';

            if (window.collectedInputs.length >= window.neededInputsCount) {
                document.getElementById('cin-prompt-container').classList.add('hidden');
                executeMockCode(window.currentCodeToExec, window.collectedInputs);
            }
        }

        function executeMockCode(code, inputs) {
            const consoleBox = document.getElementById('console-output');
            consoleBox.innerHTML += `<div class="text-slate-400">// === 開始執行 ===</div>`;

            let inputIdx = 0;
            let variables = {};

            // 模擬解譯 cout 與計算 (標準簡易預覽機制)
            const lines = code.split('\n');
            lines.forEach(line => {
                line = line.trim();
                
                // 模擬抓取變數與運算 (簡單語法剖析)
                if (line.startsWith('int ') || line.startsWith('double ') || line.startsWith('string ')) {
                    let parts = line.replace('int ', '').replace('double ', '').replace('string ', '').replace(';', '').split('=');
                    if (parts.length === 2) {
                        let vName = parts[0].trim();
                        let vVal = parts[1].trim().replace(/"/g, '');
                        variables[vName] = isNaN(vVal) ? vVal : Number(vVal);
                    }
                }

                // 模擬 cout 輸出
                if (line.startsWith('cout')) {
                    let content = line.replace('cout', '').replace(';', '').trim();
                    let outputParts = content.split('<<');
                    let lineOutput = '';

                    outputParts.forEach(p => {
                        p = p.trim();
                        if (!p) return;
                        if (p === 'endl' || p === '"\\n"') {
                            lineOutput += '<br>';
                        } else if (p.startsWith('"') && p.endsWith('"')) {
                            lineOutput += p.substring(1, p.length - 1).replace(/\\n/g, '<br>').replace(/\\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;');
                        } else if (variables.hasOwnProperty(p)) {
                            lineOutput += variables[p];
                        }
                    });

                    if (lineOutput) {
                        consoleBox.innerHTML += `<div>${lineOutput}</div>`;
                    }
                }
            });

            consoleBox.innerHTML += `<div class="text-slate-500">// === 程式執行完畢 (Process exited with code 0) ===</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
